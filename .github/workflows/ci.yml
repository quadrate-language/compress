name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build against the current compiler
    runs-on: ubuntu-latest
    container: debian:testing
    steps:
      - name: Install packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates clang git libclang-rt-dev \
            libssl-dev llvm-dev meson ninja-build patchelf pkg-config \
            python3 zlib1g-dev

      - uses: actions/checkout@v5
        with:
          path: module

      - name: Check out and build the compiler
        run: |
          git clone --depth 1 https://github.com/quadrate-language/quadrate.git
          git config --global --add safe.directory "$PWD/quadrate"
          make -C quadrate release

      - name: Build the module's C sources
        run: |
          export PATH="$PWD/quadrate/dist/bin:$PATH"
          cd module && quadpm build

      - name: Format check
        run: |
          export PATH="$PWD/quadrate/dist/bin:$PATH"
          cd module && quadfmt -c .

      - name: Lint
        run: |
          export PATH="$PWD/quadrate/dist/bin:$PATH"
          cd module && quadlint .

      - name: Test
        run: |
          export PATH="$PWD/quadrate/dist/bin:$PATH"
          mkdir -p mods/compress
          cp module/*.qd module/qd.json mods/compress/
          cp -r module/lib mods/compress/
          export QUADRATE_ROOT="$PWD/mods"
          cd module && quad test compress_test.qd
